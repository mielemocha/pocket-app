<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pocket</title>

  <link
    rel="stylesheet"
    href="style.css?v=6"
  >
</head>

<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1>Pocket</h1>

        <p
          id="app-subtitle"
          class="app-subtitle"
        >
          予定を入れて、記録としてしまう。
        </p>
      </div>

      <button
        id="add-button"
        class="add-btn"
        type="button"
        aria-label="予定を追加"
      >
        ＋
      </button>
    </header>

    <!-- 予定画面 -->
    <section id="pocket-view">
      <h2 class="section-title">
        予定
      </h2>

      <ul
        id="schedule-list"
        class="schedule-list"
      ></ul>

      <p
        id="empty-message"
        class="empty-message"
      >
        予定はまだありません。
      </p>
    </section>

    <!-- Archive画面 -->
    <section
      id="archive-view"
      class="hidden"
    >
      <div class="archive-heading">
        <div>
          <h2 class="section-title">
            Archive
          </h2>

          <p class="archive-description">
            過ぎた時間を、週ごとに振り返ります。
          </p>
        </div>
      </div>

      <!-- タグ検索 -->
      <div class="archive-search">
        <div class="search-input-area">
          <span class="search-icon">
            ⌕
          </span>

          <input
            type="search"
            id="archive-search-input"
            placeholder="タグを検索"
            autocomplete="off"
          >

          <button
            id="clear-search-button"
            class="clear-search-btn hidden"
            type="button"
            aria-label="検索を消去"
          >
            ×
          </button>
        </div>
      </div>

      <!-- タグ一覧 -->
      <div
        id="archive-tag-list"
        class="archive-tag-list"
      ></div>

      <!-- 週タブ -->
      <div
        id="archive-week-tabs"
        class="archive-week-tabs"
      ></div>

      <!-- Archiveフィード -->
      <div
        id="archive-list"
        class="archive-list"
      ></div>

      <p
        id="archive-empty-message"
        class="empty-message"
      >
        記録はまだありません。
      </p>
    </section>
  </main>

  <!-- 画面下部ナビゲーション -->
  <nav
    class="bottom-nav"
    aria-label="メインメニュー"
  >
    <button
      id="pocket-nav-button"
      class="bottom-nav-button active"
      type="button"
    >
      <span class="bottom-nav-icon">
        ○
      </span>

      <span>
        予定
      </span>
    </button>

    <button
      id="archive-nav-button"
      class="bottom-nav-button"
      type="button"
    >
      <span class="bottom-nav-icon">
        ▣
      </span>

      <span>
        Archive
      </span>
    </button>
  </nav>

  <!-- 共通モーダル -->
  <div
    id="modal-bg"
    class="modal-bg hidden"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-header">
        <h2 id="modal-title">
          予定を追加
        </h2>

        <button
          id="close-modal"
          class="close-btn"
          type="button"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>

      <!-- モーダル内タブ -->
      <div
        class="modal-tabs"
        role="tablist"
      >
        <button
          id="plan-tab"
          class="modal-tab active"
          type="button"
          role="tab"
          aria-selected="true"
        >
          予定
        </button>

        <button
          id="record-tab"
          class="modal-tab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          記録
        </button>
      </div>

      <!-- 予定フォーム -->
      <section
        id="plan-panel"
        class="modal-panel"
      >
        <form id="schedule-form">
          <label for="schedule-title">
            タイトル
          </label>

          <input
            type="text"
            id="schedule-title"
            placeholder="例：友達と映画を見る"
            required
          >

          <label for="schedule-memo">
            予定メモ
          </label>

          <textarea
            id="schedule-memo"
            placeholder="集合場所や補足など（任意）"
            rows="4"
          ></textarea>

          <button
            class="primary-btn"
            type="submit"
          >
            予定を保存
          </button>
        </form>
      </section>

      <!-- 記録フォーム -->
      <section
        id="record-panel"
        class="modal-panel hidden"
      >
        <form id="record-form">
          <div class="source-plan">
            <span class="source-plan-label">
              元の予定
            </span>

            <strong id="record-plan-title">
              予定を選択してください
            </strong>

            <p
              id="record-plan-memo"
              class="source-plan-memo"
            ></p>
          </div>

          <label for="record-photo">
            写真
          </label>

          <input
            type="file"
            id="record-photo"
            accept="image/*"
          >

          <!-- 写真プレビュー -->
          <div
            id="photo-preview-area"
            class="photo-preview-area hidden"
          >
            <img
              id="photo-preview"
              class="photo-preview"
              src=""
              alt="選択した写真のプレビュー"
            >

            <button
              id="remove-photo-preview"
              class="remove-photo-preview"
              type="button"
            >
              選択を取り消す
            </button>
          </div>

          <p
            id="current-photo-name"
            class="current-photo-name hidden"
          ></p>

          <label for="record-memo">
            記録メモ
          </label>

          <textarea
            id="record-memo"
            placeholder="実際はどうだった？"
            rows="5"
          ></textarea>

          <label for="record-tags">
            タグ
          </label>

          <input
            type="text"
            id="record-tags"
            placeholder="映画, 友達, おでかけ"
          >

          <p class="field-hint">
            タグはカンマ区切りで入力します。
          </p>

          <label for="record-date">
            記録日
          </label>

          <input
            type="date"
            id="record-date"
            required
          >

          <button
            class="primary-btn"
            type="submit"
          >
            記録として保存
          </button>
        </form>
      </section>
    </div>
  </div>

  <!-- JavaScriptは依存関係の順番で読み込む -->
  <script src="storage.js?v=6"></script>
  <script src="modal.js?v=6"></script>
  <script src="archive.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
