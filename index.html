<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>予定と記録ツール</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    h2 {
      margin-top: 32px;
    }
    input, textarea {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      font-size: 16px;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      margin-top: 6px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 12px;
      border-bottom: 1px solid #ccc;
    }
.delete-btn {
  background: #ff6666;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 8px;
  display: inline-block;
}

.delete-btn:hover {
  background: #ff4c4c;
}
li {
  padding: 12px;
  border-bottom: 1px solid #ccc;
}

  </style>
</head>
<body>

  <h1>予定と記録ツール</h1>

  <!-- 予定追加フォーム -->
  <h2>予定を登録</h2>
  <form id="schedule-form">
    <input type="text" id="schedule-title" placeholder="タイトル" required>
    <textarea id="schedule-memo" placeholder="メモ" required></textarea>
    <button type="submit">予定を追加</button>
  </form>

  <!-- 予定一覧 -->
  <h2>予定一覧</h2>
  <ul id="schedule-list"></ul>

  <!-- app.js（キャッシュ対策付き） -->
  <script src="app.js?v=3"></script>


</body>
</html>
