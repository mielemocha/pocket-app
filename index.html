<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Pocket</title>

  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css?v=8">
<link rel="stylesheet" href="css/fab.css?v=2">
</head>

<body>
  <!-- 画面上部バー -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="app-brand">
        <h1>Pocket</h1>

        <p
          id="app-subtitle"
          class="app-subtitle"
        >
          予定を入れて、記録としてしまう。
        </p>
      </div>

      <div class="settings-area">
        <button
          id="settings-menu-button"
          class="settings-menu-button"
          type="button"
          aria-label="設定メニューを開く"
          aria-expanded="false"
          aria-controls="settings-menu"
        >
          <span aria-hidden="true">
            ⋮
          </span>
        </button>

        <!-- 設定ポップアップ -->
        <div
          id="settings-menu"
          class="settings-menu hidden"
          role="menu"
        >
          <button
            id="export-button"
            class="settings-menu-item"
            type="button"
            role="menuitem"
          >
            <span
              class="settings-menu-icon"
              aria-hidden="true"
            >
              ↓
            </span>

            <span>
              バックアップ
            </span>
          </button>

          <button
            id="import-button"
            class="settings-menu-item"
            type="button"
            role="menuitem"
          >
            <span
              class="settings-menu-icon"
              aria-hidden="true"
            >
              ↑
            </span>

            <span>
              インポート
            </span>
          </button>

          <div
            class="settings-menu-divider"
            aria-hidden="true"
          ></div>

          <button
            id="version-button"
            class="settings-menu-item"
            type="button"
            role="menuitem"
          >
            <span
              class="settings-menu-icon"
              aria-hidden="true"
            >
              ⓘ
            </span>

            <span>
              バージョン情報
            </span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- メイン画面 -->
  <main class="app">
    <!-- 予定画面 -->
    <section id="pocket-view">
      <h2 class="section-title">
        予定
      </h2>

      <ul
        id="schedule-list"
        class="schedule-list"
      ></ul>

      <p
        id="empty-message"
        class="empty-message"
      >
        予定はまだありません。
      </p>
    </section>

    <!-- Archive画面 -->
    <section
      id="archive-view"
      class="hidden"
    >
      <div class="archive-heading">
        <div>
          <h2 class="section-title">
            Archive
          </h2>

          <p class="archive-description">
            過ぎた時間を、週ごとに振り返ります。
          </p>
        </div>
      </div>

      <!-- タグ検索 -->
      <div class="archive-search">
        <div class="search-input-area">
          <span
            class="search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            type="search"
            id="archive-search-input"
            placeholder="タグを検索"
            autocomplete="off"
          >

          <button
            id="clear-search-button"
            class="clear-search-btn hidden"
            type="button"
            aria-label="検索を消去"
          >
            ×
          </button>
        </div>
      </div>

      <!-- タグ一覧 -->
      <div
        id="archive-tag-list"
        class="archive-tag-list"
      ></div>

      <!-- 週タブ -->
      <div
        id="archive-week-tabs"
        class="archive-week-tabs"
      ></div>

      <!-- Archiveフィード -->
      <div
        id="archive-list"
        class="archive-list"
      ></div>

      <p
        id="archive-empty-message"
        class="empty-message"
      >
        記録はまだありません。
      </p>
    </section>
  </main>

  <!-- フローティング追加ボタン -->
  <button
    id="add-button"
    class="add-btn floating-add-btn"
    type="button"
    aria-label="予定を追加"
    title="予定を追加"
  >
    <span aria-hidden="true">
      ＋
    </span>
  </button>

  <!-- 画面下部ナビゲーション -->
  <nav
    class="bottom-nav"
    aria-label="メインメニュー"
  >
    <button
      id="pocket-nav-button"
      class="bottom-nav-button active"
      type="button"
    >
      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ○
      </span>

      <span>
        予定
      </span>
    </button>

    <button
      id="archive-nav-button"
      class="bottom-nav-button"
      type="button"
    >
      <span
        class="bottom-nav-icon"
        aria-hidden="true"
      >
        ▣
      </span>

      <span>
        Archive
      </span>
    </button>
  </nav>

  <!-- 予定・記録 共通モーダル -->
  <div
    id="modal-bg"
    class="modal-bg hidden"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-header">
        <h2 id="modal-title">
          予定を追加
        </h2>

        <button
          id="close-modal"
          class="close-btn"
          type="button"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>

      <!-- モーダル内タブ -->
      <div
        class="modal-tabs"
        role="tablist"
      >
        <button
          id="plan-tab"
          class="modal-tab active"
          type="button"
          role="tab"
          aria-selected="true"
        >
          予定
        </button>

        <button
          id="record-tab"
          class="modal-tab"
          type="button"
          role="tab"
          aria-selected="false"
        >
          記録
        </button>
      </div>

      <!-- 予定フォーム -->
      <section
        id="plan-panel"
        class="modal-panel"
      >
        <form id="schedule-form">
          <label for="schedule-title">
            タイトル
          </label>

          <input
            type="text"
            id="schedule-title"
            placeholder="例：友達と映画を見る"
            required
          >

          <label for="schedule-memo">
            予定メモ
          </label>

          <textarea
            id="schedule-memo"
            placeholder="集合場所や補足など（任意）"
            rows="4"
          ></textarea>

          <button
            class="primary-btn"
            type="submit"
          >
            予定を保存
          </button>
        </form>
      </section>

      <!-- 記録フォーム -->
      <section
        id="record-panel"
        class="modal-panel hidden"
      >
        <form id="record-form">
          <div class="source-plan">
            <span class="source-plan-label">
              元の予定
            </span>

            <strong id="record-plan-title">
              予定を選択してください
            </strong>

            <p
              id="record-plan-memo"
              class="source-plan-memo"
            ></p>
          </div>

          <!-- 写真 -->
          <label for="record-photo">
            写真
          </label>

          <input
            type="file"
            id="record-photo"
            accept="image/*"
          >

          <!-- 選択中の写真プレビュー -->
          <div
            id="photo-preview-area"
            class="photo-preview-area hidden"
          >
            <img
              id="photo-preview"
              class="photo-preview"
              src=""
              alt="選択した写真のプレビュー"
            >

            <button
              id="remove-photo-preview"
              class="remove-photo-preview"
              type="button"
            >
              選択を取り消す
            </button>
          </div>

          <!-- 既存記録の写真名 -->
          <p
            id="current-photo-name"
            class="current-photo-name hidden"
          ></p>

          <label for="record-memo">
            記録メモ
          </label>

          <textarea
            id="record-memo"
            placeholder="実際はどうだった？"
            rows="5"
          ></textarea>

          <label for="record-tags">
            タグ
          </label>

          <input
            type="text"
            id="record-tags"
            placeholder="映画, 友達, おでかけ"
          >

          <p class="field-hint">
            タグはカンマ区切りで入力します。
          </p>

          <label for="record-date">
            記録日
          </label>

          <input
            type="date"
            id="record-date"
            required
          >

          <button
            class="primary-btn"
            type="submit"
          >
            記録として保存
          </button>
        </form>
      </section>
    </div>
  </div>

  <!-- バージョン情報モーダル -->
  <div
    id="version-modal-bg"
    class="modal-bg hidden"
  >
    <div
      class="info-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="version-modal-title"
    >
      <div class="modal-header">
        <h2 id="version-modal-title">
          Pocket
        </h2>

        <button
          id="close-version-modal"
          class="close-btn"
          type="button"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>

      <div class="info-modal-content">
        <p class="version-number">
          Version 1.1.0 β
        </p>

        <p class="version-description">
          予定をポケットに入れ、<br>
          終わったら記録としてしまうアプリ。
        </p>
      </div>
    </div>
  </div>

  <!-- インポート用ファイル選択 -->
  <input
    type="file"
    id="import-file-input"
    class="hidden"
    accept=".json,application/json"
  >

  <!-- JavaScript -->
  <script src="js/storage/storage.js?v=8"></script>
<script src="js/modal/modal.js?v=9"></script>
  <script src="js/archive/archive.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
